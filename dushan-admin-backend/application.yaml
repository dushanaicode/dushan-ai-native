# 公共默认配置；环境文件只写差异，同一分组按字段递归合并。
# 覆盖顺序：本文件 → 所选环境文件 → 非生产个人覆盖 → 进程环境变量。

# ==================== 应用服务配置 ====================
server:
  name: dushan-ai-native # 应用名称，显示在启动摘要和接口文档中
  version: "0.0.0" # 应用版本，供健康检查和接口文档使用
  env: dev # 默认环境；--env 优先于 SERVER_ENV，再采用此值
  engine: granian # 默认 HTTP 引擎；--server 优先于 SERVER_ENGINE，再采用此值
  host: 127.0.0.1 # 默认监听回环地址；对外访问时按部署方式配置
  port: 48080 # HTTP 端口，范围 1～65535；可通过 SERVER_PORT 覆盖
  debug: false # 调试开关；生产环境禁止开启
  reload: false # 热重载开关，由开发环境配置开启；生产环境禁止开启
  docs_enabled: true # Swagger/ReDoc/OpenAPI 接口文档开关，与独立文档站无关
  docs_url: /docs # Swagger 页面路径
  redoc_url: /redoc # ReDoc 页面路径
  openapi_url: /openapi.json # OpenAPI 文档路径
  root_path: "" # 反向代理的挂载路径前缀，直接访问时留空

# ==================== Loguru 日志配置 ====================
log:
  root_dir: server/logs # 文件日志目录，相对路径以配置目录为基准；可通过 LOG_ROOT_DIR 覆盖
  enable_file_overall: true # 文件日志总开关；关闭后不会创建日志目录
  enable_json_format: false # 是否额外输出包含上下文字段的 JSONL 日志
  loadtest_mode: false # 压测模式强制关闭文件日志，并将控制台阈值设为 WARNING
  console_level: INFO # TRACE/DEBUG/INFO/SUCCESS/WARNING/ERROR/CRITICAL；NONE 关闭控制台
  file_active_types: [warning, error] # 启用的文件类型：info、warning、error
  rotation_size: "20 MB" # 单文件达到此大小后轮转
  enqueue: true # 使用队列写入；应用退出时先排空队列
  compression: zip # 轮转或关闭后压缩，null 表示不压缩
  file_level_info: INFO # info 文件的最低日志级别
  retention_info: "7 days" # info 文件保留时间
  file_level_warning: WARNING # warning 文件的最低日志级别
  retention_warn: "15 days" # warning 文件保留时间
  file_level_error: ERROR # error 文件的最低日志级别
  retention_error: "30 days" # error 文件保留时间

# ==================== 启动横幅配置 ====================
banner:
  enabled: true # 展示总开关；常规生命周期日志仍由 log 配置控制
  show_logo: true # 显示完整 DUSHAN / AI ADMIN / NO BUG 字符横幅
  show_worship: true # 显示参考实现中的完整祈福图案，可按需关闭
  show_startup_info: true # 显示应用版本、环境、监听地址及已开启的接口文档入口
  author: DUSHAN # 展示作者，空字符串表示不显示
  documentation_url: "" # 可选项目文档站地址；空字符串表示不显示，不内置外部站点链接

# ==================== 配置模型与运行覆盖 ====================
config:
  models: # 模型通过自身环境前缀覆盖字段，例如 DATABASE_ENABLED
    database:
      enabled: false # 填写来源后开启；关闭时不导入驱动或连接数据库
      sources: [] # 每项明确 name/url/role/weight/pool/tls；role=primary/replica/named，pool=null 继承下方池配置
      # tls=null 不启用 TLS；启用时填写 ca_file/certificate_file/private_key_file（可为 null），始终校验证书和主机名。
      pool:
        size: 10 # 每个端点、每个应用进程的常驻连接数
        max_overflow: 20 # 高峰期临时连接上限；0 禁止溢出
        timeout_seconds: 30.0 # 连接池借用等待秒数
        recycle_seconds: 3600 # 回收连接年龄秒数；-1 不按年龄回收
        pre_ping: true # 借出前探活，失效连接由 SQLAlchemy 丢弃
      connect_timeout_seconds: 10.0 # 启动和健康探测的总超时秒数
      replica_strategy: round_robin # round_robin/random/weighted/least_connections
      health_check_enabled: true # 后台探活；启动时主库探活始终执行
      health_check_interval_seconds: 30.0
      replication_check_enabled: false # 开启后要求 MySQL/PG 复制状态查询权限
      max_replication_lag_seconds: 10.0 # 副本最大容许复制延迟
      slow_query_enabled: true # 输出安全观测字段，绝不输出原始 SQL 或参数
      slow_query_threshold_ms: 500.0
      query_observation_enabled: true # 同步安全查询事件；关闭后不调用 observer
      query_template_enabled: false # 模板仅保留白名单 SQL 结构，标识符和字面值均脱敏
      query_fingerprint_enabled: true # 安全模板的 SHA-256，不对原始 SQL 或参数计算摘要
      query_sample_rate: 1.0 # 查询事件采样率；慢查询诊断独立启用
      query_max_statement_length: 65536 # 超限不解析模板/指纹，避免无界观测开销
      query_max_template_length: 1024 # 模板输出字符上限
      dynamic_enabled: false # 按 named 角色显式替换动态源
      dynamic_refresh_interval_seconds: 5.0 # 绑定上层配置提供器后的轮询秒数
      soft_delete_enabled: true # 默认过滤 BaseDO 已删除记录
      audit_enabled: true # 自动填充当前作用域账户；UTC 时间始终由模型策略填写
      id_strategy: database # database 使用数据库自增；snowflake 使用已有 SnowflakeUtils
      snowflake_machine_id: null # snowflake 必须显式分配 0～1023；同机器号不能被多进程同时使用
      after_commit_result_limit: 100 # 最近提交后动作结果的最大条数
  source_order: [environment, memory, external, file, yaml] # 优先级从高到低；模型/字段可显式收紧
  files: [] # [{path: config-overrides.yaml, required: true}]；后列文件覆盖先列同名键
  reload_enabled: false # 显式内存/文件/外部快照刷新；不启动后台监听线程
  max_source_bytes: 1048576 # 单个附加文件读取上限，单位字节
  max_source_items: 10000 # 每份展开配置的最大键数，防止循环或过大输入

# ==================== 依赖注入容器 ====================
di:
  enabled: true # false 不评估 DI 条件、不创建组件；配置模型与错误码仍独立可用
  default_scope: singleton # 未在装饰器显式指定时使用；可选 singleton、transient
  hook_timeout_seconds: 30.0 # 异步生命周期协作取消期限，不能强制终止阻塞用户代码
  lookup_enabled: true # 开放 get_bean；关闭后构造/字段/HTTP 参数注入仍可使用
  automatic_context_binding: true # HTTP/WebSocket 入口自动绑定上下文；关闭后须显式建立执行边界
  drain_timeout_seconds: 30.0 # 超时后协作取消受管任务，仍等实际执行结束再释放依赖
  metrics_enabled: true # 关闭可选解析计时和计数，不关闭必要错误与资源检查
  task_error_limit: 100 # 保留最近 N 项后台任务失败供关闭汇总；每次失败仍即时记录日志，累计计数不受截断影响

# ==================== 模块声明配置 ====================
modules:
  packages: [framework] # 允许定位的已安装普通包，各自提供 module.toml；不会执行声明包
  enabled: [framework] # 按声明 name 启用，[] 表示不启用模块；必要依赖必须同时显式启用

# ==================== Python 定义扫描 ====================
scanner:
  enabled: true # 仅控制自动遍历；模块声明、语言资源与 module.toml 的显式 definitions 独立加载
  component_types: null # null 全部；[] 不导入候选；可选 component、error_code、config_model
  include_packages: null # null 全部；[] 不扫描；完整包前缀，例如 module_account.definitions
  exclude_packages: [] # 优先于 include，排除包及其全部子模块；环境列表使用 JSON 数组
  ignored_directories: [__pycache__, temp] # 扫描根内按目录名（不区分大小写）跳过的子目录，不校验不导入；[] 只跳过点开头的隐藏目录
  diagnostics_enabled: true # 开启分阶段耗时、跳过原因与慢导入统计；不改变来源校验
  diagnostic_limit: 10 # 跳过样例和慢模块各自最多保留多少项（1–100）

# ==================== 国际化配置 ====================
# 环境变量使用 I18N_ 前缀，如 I18N_DEFAULT_LOCALE=en-US。
# supported_locales/resource_roots/scopes 的环境变量值使用 JSON 数组。
i18n:
  enabled: true # 启用翻译；关闭后不读取语言资源，使用调用方默认提示
  default_locale: zh-CN # 默认语言，必须与下方一个标签完全一致
  supported_locales: [zh-CN, en-US] # 新增语言只需增加标签并提供同名 JSON
  match_mode: primary # exact 只匹配完整标签；primary 还允许匹配语言主标签
  fallback_to_default: true # 请求语言缺少文案时尝试默认语言
  missing_policy: fallback # 缺键策略：fallback 返回默认提示，key 返回键，error 抛配置异常
  format_error_policy: fallback # 翻译模板格式失败：fallback 返回默认提示，error 抛配置异常
  log_missing: true # 是否记录缺失翻译的警告
  cache_size: 4096 # 翻译查找缓存条数，0 表示关闭
  missing_cache_size: 1024 # 缺键去重记录条数；0 不保存，开启 log_missing 时每次缺失都会记录
  validate_translations: true # 启动和热更新时检查应用要求的错误码文案
  validation_policy: error # 缺少必需文案时：error 阻止启用，warning 仅警告
  required_message_keys: [] # 额外必须具备双语/多语翻译的业务消息键，无需修改框架校验列表
  hot_reload: false # 按请求触发资源变化检查；配置项变化仍需重启
  reload_interval: 2.0 # 热更新检查间隔，单位秒，必须大于 0
  include_builtin: true # 加载 framework scope 的框架内置语言资源
  resource_roots: [] # 外部资源根列表；相对路径以应用配置目录为基准
  # 示例：[{path: modules/account/i18n, scope: account, required: true}]
  # 每个目录直接放 zh-CN.json 等文件；同 scope 后加载目录覆盖前目录的同名键。
  scopes: null # null 加载全部；数组选择列出的 scope 及其子 scope，[] 表示全部不选

# ==================== 分页配置 ====================
page:
  default_size: 10 # 请求省略 pageSize 时采用；页码固定从1开始
  max_size: 200 # 普通分页单页上限；可由 PAGE_MAX_SIZE 覆盖
  fetch_all_enabled: false # 全量读取总开关；还需服务端显式启用，不能代替业务鉴权
  fetch_all_max_rows: 5000 # 全量读取平台上限，接口只能收紧
  max_sort_fields: 5 # 一次请求的排序字段上限，0 表示禁止客户端排序

# ==================== 响应与下载配置 ====================
response:
  download_cache: no-store # no-store 禁止保存；private/public 需业务确认内容可缓存
  download_max_age: 0 # private/public 缓存有效期秒数；no-store 模式不使用
  max_memory_bytes: 10485760 # 预生成内存下载上限，超过时使用磁盘或生成器
  file_chunk_size: 65536 # 标准文件响应读取块大小，必须是正整数
  attachment: true # true 作为附件下载；false 内联展示须另行审查主动内容风险

# ==================== 日期工具配置 ====================
datetime:
  timezone: Asia/Shanghai # 日期工具的本地时区；DATETIME_TIMEZONE 可覆盖，不决定数据库存储时区
  format: "%Y-%m-%d %H:%M:%S" # 日期时间默认格式
  date_format: "%Y-%m-%d" # 日期标签格式
  time_format: "%H:%M:%S" # 每日时间窗口的输入格式
  month_format: "%Y-%m" # 月份标签格式
  year_format: "%Y" # 年份标签格式
  max_range_segments: 10000 # 单次日期范围拆分的最大段数

# ==================== 受限表达式配置 ====================
expression:
  enabled: false # 按需显式开启；仅支持受限表达式，不执行任意代码或模板语句
  max_length: 2000 # 模板字符数上限
  max_context_bytes: 65536 # 上下文 JSON 字节上限
  max_output_bytes: 65536 # 输出字节上限；不能替代进程的 CPU/内存限制
  max_depth: 20 # 语法和数据的最大嵌套深度

# ==================== Granian 引擎配置 ====================
# 由 server.engine 选择引擎；也可通过 --server uvicorn 显式覆盖。
granian:
  workers: 1 # 工作进程数，至少为 1；热重载时实际使用单进程
  threads: 1 # 非热重载模式下的运行线程数，至少为 1

# ==================== Uvicorn 引擎配置 ====================
uvicorn:
  workers: 1 # 工作进程数，至少为 1；热重载时实际使用单进程
  log_level: info # 引擎日志级别：critical/error/warning/info/debug/trace
