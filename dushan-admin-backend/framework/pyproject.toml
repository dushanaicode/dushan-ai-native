[project]
name = "framework"
version = "0.0.0"
description = "dushan-ai-native 公共框架与基础组件"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    # 公共异常处理与响应直接使用的 Web 类型。
    "fastapi==0.137.1",
    "starlette==1.3.1",
    # 原生 Form/UploadFile 解析，以及显式富文本净化。
    "python-multipart==0.0.32",
    "nh3==0.3.7",
    # 异步生成器关闭时隔离取消信号。
    "anyio==4.15.1",
    # SQL分页直接使用异步Session和查询表达式。
    "SQLAlchemy[asyncio]==2.0.52",
    # MySQL 主线与 PostgreSQL 辅线；rsa 支持 MySQL 8 的完整认证交换。
    "aiomysql[rsa]==0.3.2",
    "asyncpg==0.31.0",
    # 配置加载、校验与日志组件。
    "pydantic==2.13.4",
    "PyYAML==6.0.3",
    "loguru==0.7.3",
    # 追踪 API、SDK 与 OTLP 导出器使用同一发布版本。
    "opentelemetry-api==1.44.0",
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-exporter-otlp-proto-grpc==1.44.0",
    "grpcio==1.83.1", # 直接使用TLS凭据、压缩及有界通道选项
    # 受限表达式渲染，以及 Windows 等无系统时区库环境的日期工具。
    "Jinja2==3.1.6",
    "tzdata==2026.3",
    # 显式依赖绑定、作用域及多实现集合；容器按应用独立创建。
    "injector==0.24.0",
    # Redis 官方异步客户端；连接池与客户端按应用持有，不使用其全局单例入口。
    "redis==7.4.1",
    # 调度引擎固定 3.11；Cron 的验证、预览和实际触发共用解析。
    "APScheduler==3.11.3",
    "croniter==6.2.4",
    # MQ 直接使用成熟异步客户端的确认、消费组与流控接口。
    "aio-pika==10.0.1",
    "aiokafka==0.14.0",
    "pamqp==4.0.1", # 显式识别 AMQP 发布确认帧，拒绝负确认
    # XLSX 读写与不可信 XML 的实体扩展防护。
    "openpyxl==3.1.5",
    "defusedxml==0.7.1",
    # 仅显式启用在线 IP Provider 时发起请求；沿用测试环境已用版本。
    "httpx==0.28.1",
    # OIDC 签名和声明验证；RSA2 授权签名复用已锁定的 cryptography。
    "joserfc==1.7.5",
    "cryptography==50.0.1",
    # 本站密码哈希，明确拒绝 72 UTF-8 字节以上的密码。
    "bcrypt==5.0.0",
    # ip2region 官方 Python IPv4/IPv6 查询绑定，数据库随组件独立入包。
    "py-ip2region==3.0.4",
    # 本地滑块与汉字点选图像生成；字体及其 OFL 许可证随组件入包。
    "Pillow==12.3.0",
]

[project.optional-dependencies]
opengauss = ["opengauss-sqlalchemy==2.4.0"]
dameng = ["dmSQLAlchemy==2.0.17", "dmAsync==1.0.0", "dmPython==2.5.38", "async-timeout==5.0.1"]

[project.entry-points."sqlalchemy.dialects"]
"kingbase.asyncpg" = "framework.starter_database.dialects.kingbase_asyncpg:KingbaseAsyncpgDialect"
"dm.dushan_async" = "framework.starter_database.dialects.dm_async_dialect:DmAsyncDialect"
"oceanbase.aiomysql" = "framework.starter_database.dialects.oceanbase_aiomysql:OceanBaseAiomysqlDialect"

[tool.poetry]
packages = [{ include = "framework", from = ".." }]
exclude = ["**/Temp/**", "**/.docs/**", "**/.venv/**", "pyproject.toml"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
