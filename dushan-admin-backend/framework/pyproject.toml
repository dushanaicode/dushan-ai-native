[project]
name = "framework"
version = "0.0.0"
description = "渡山 AI Native 公共框架与基础组件"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    # 公共异常处理与响应直接使用的 Web 类型。
    "fastapi==0.137.1",
    "starlette==1.3.1",
    # 异步生成器关闭时隔离取消信号。
    "anyio==4.15.1",
    # SQL分页直接使用异步Session和查询表达式。
    "SQLAlchemy[asyncio]==2.0.52",
    # 配置加载、校验与日志组件。
    "pydantic==2.13.4",
    "PyYAML==6.0.3",
    "loguru==0.7.3",
    "opentelemetry-api==1.21.0",
]

[tool.poetry]
packages = [{ include = "framework", from = ".." }]
exclude = ["**/Temp/**", "**/.docs/**", "**/.venv/**", "pyproject.toml"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
