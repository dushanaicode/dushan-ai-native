[project]
name = "module-infra"
version = "0.0.0"
description = "dushan-ai-native 基础设施模块"
requires-python = ">=3.12,<3.13"
license = "MIT"
# 根项目与 framework 已声明的库不重复，此处只列本模块特有的库。
dependencies = [
    "psutil==7.2.2",
    "aioftp==0.25.2",
    "asyncssh==2.20.0",
    "boto3==1.37.38",
    "botocore==1.37.38",
    "filetype==1.2.0",
]

[tool.poetry]
packages = [{ include = "module_infra", from = ".." }]
exclude = ["**/Temp/**", "**/.docs/**", "**/.venv/**", "pyproject.toml"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
