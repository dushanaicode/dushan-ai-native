[project]
name = "module-system"
version = "0.0.0"
description = "dushan-ai-native 系统管理模块：身份、组织、权限与对外通道"
requires-python = ">=3.12,<3.13"
license = "MIT"
# 根项目与 framework 已声明的库不重复，此处只列本模块特有的库。
dependencies = [
    "aiosmtplib==4.0.0",
    "tencentcloud-sdk-python==3.1.44",
    "email-validator==2.3.0",
    "user-agents==2.2.0",
]

[tool.poetry]
packages = [{ include = "module_system", from = ".." }]
exclude = ["**/Temp/**", "**/.docs/**", "**/.venv/**", "pyproject.toml"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
