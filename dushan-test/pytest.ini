[pytest]
pythonpath =
    ../dushan-admin-backend
    .
testpaths =
    server
    framework
    module_system
    module_infra
python_files = test_*.py
python_functions = test_*
addopts = --strict-markers --tb=short -ra
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    unit: 不依赖外部服务的单元验证
    smoke: 使用本地临时进程验证真实 HTTP 启动
